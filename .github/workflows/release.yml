name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag à publier, par exemple v1.0.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-37.0

      # Pas de cache pour un APK signé : le build part toujours des sources du tag.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Préparer la signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      # Le cache de configuration écrirait les mots de passe sur le disque.
      - name: Construire l'APK signé
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Vérifier la signature et la version
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -F "versionName='${TAG#v}'"
          mv "$apk" "repmomentum-${TAG#v}.apk"

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "RepMomentum ${TAG#v}" --generate-notes
          gh release upload "$TAG" "repmomentum-${TAG#v}.apk" --clobber
